name: Container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ploos-as/red-discordbot

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - id: versions
        name: Read version pins
        run: echo "redbot=$(cat REDBOT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Static validation
        run: tests/static.sh
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: red-discordbot:test
          build-args: |
            REDBOT_VERSION=${{ steps.versions.outputs.redbot }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container tests
        run: |
          IMAGE=red-discordbot:test scripts/smoke-test.sh
          IMAGE=red-discordbot:test scripts/test-container.sh
          IMAGE=red-discordbot:test tests/entrypoint-args.sh
          IMAGE=red-discordbot:test bash tests/runtime-qualification.sh
          IMAGE=red-discordbot:test FROM_IMAGE=ghcr.io/ploos-as/red-discordbot:0.1.0 bash tests/upgrade-qualification.sh
          IMAGE=red-discordbot:test bash tests/hardening-qualification.sh
          IMAGE=red-discordbot:test bash tests/release-qualification.sh

  publish-edge-or-tag:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - id: versions
        name: Read version pins
        run: echo "redbot=$(cat REDBOT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/red-discordbot
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-3.0-only
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REDBOT_VERSION=${{ steps.versions.outputs.redbot }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release-from-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-edge-or-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -s "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Red-DiscordBot container ${GITHUB_REF_NAME#v}" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Red-DiscordBot container ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
